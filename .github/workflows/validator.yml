name: Governance Validator

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validation_check:
    name: "🧪 Pre-Flight: Schema & Range Governance"
    runs-on: ubuntu-latest
    steps:
      - name: 🗂️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git log to function

      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          git config --global user.name "Automation Engine [${{ github.ref_name }}]"
          git config --global user.email "automation-${{ github.ref_name }}@yourdomain.com"
          git config --global notes.rewriteRef "refs/notes/*"

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema

      - name: 🧪 Run Governance Validation
        run: |
          echo "🚀 Initiating: Governance Validation Suite"
          pytest tests/test_governance_validation.py -vv -s --log-cli-level=INFO

      - name: 🏁 Validation Summary
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ Governance Check Passed: All schemas and range configs are compliant."
          else
            echo "❌ Governance Check Failed: Please review the validator output above."
            exit 1
          fi

      - name: 🔒 Version & Lock Governance Assets
        if: success()
        run: |
          # Target directories
          DIRS=("configs" "pipelines" "setup_scripts")
          
          for dir in "${DIRS[@]}"; do
            if [ -d "$dir" ]; then
              for file in "$dir"/*; do
                if [ -f "$file" ]; then
                  # Generate a hash based purely on the FILE CONTENT (7 characters)
                  CONTENT_HASH=$(git hash-object "$file" | cut -c1-7)
                  
                  # Extract extension and base name
                  ext="${file##*.}"
                  filename=$(basename "$file")
                  base="${filename%.*}"
                  
                  # Logic: If the file already contains the hash, skip renaming
                  if [[ "$base" == *"_$CONTENT_HASH" ]]; then
                    echo "✅ File $filename is already versioned correctly ($CONTENT_HASH). Skipping."
                    continue
                  fi
                  
                  # Remove any old hash suffix (strips _[a-f0-9]+ from the end of the base name)
                  new_base=$(echo "$base" | sed -E 's/_[a-f0-9]+$//')
                  new_filename="${new_base}_${CONTENT_HASH}.${ext}"
                  
                  echo "🔄 Renaming $filename to $new_filename"
                  git mv "$file" "$dir/$new_filename"

                  # ---------------------------------------------------------
                  # 🔍 NEW: Update references to old filename inside all files
                  # ---------------------------------------------------------
                  echo "🔎 Searching for references to $filename → $new_filename"

                  matches=$(grep -RIl "$filename" . || true)

                  if [ -z "$matches" ]; then
                    echo "ℹ️ No references found for $filename"
                  else
                    echo "📄 Found references in:"
                    echo "$matches"

                    for mfile in $matches; do
                      echo "✏️ Updating $mfile"
                      sed -i "s/$filename/$new_filename/g" "$mfile"
                      echo "✅ Updated $mfile"
                    done
                  fi
                  # ---------------------------------------------------------
                fi
              done
            fi
          done
          
          # Commit the changes if there are any
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "🤖 robot: version-lock governance assets [skip ci]"
            git push origin HEAD
            echo "🚀 Version lock pushed to repository."
          else
            echo "✅ All files are already perfectly version-locked."
          fi