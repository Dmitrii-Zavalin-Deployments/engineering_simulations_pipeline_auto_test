name: 🗄️ Storage & Validation

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validation_check:
    name: "🗄️ Storage & Validation"
    runs-on: ubuntu-latest
    steps:
      - name: 🗂️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git log to function

      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          git config --global user.name "Automation Engine [${{ github.ref_name }}]"
          git config --global user.email "automation-${{ github.ref_name }}@yourdomain.com"
          git config --global notes.rewriteRef "refs/notes/*"

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema

      - name: 🧪 Run Governance & Pipeline Sandbox Validation
        run: |
          echo "🚀 Initiating: Governance & Dynamic Sandbox Validation Suite"
          
          # Initialize metrics tracking logs
          rm -f /tmp/cpu_track.log /tmp/pytest_mem.log /tmp/mem_sandbox_*.log
          
          # Spawn high-frequency active background CPU load sampler
          while true; do
            top -bn1 | grep "Cpu(s)" | awk '{print $2 + $4}' >> /tmp/cpu_track.log 2>/dev/null || true
            sleep 1
          done &
          SAMPLER_PID=$!
          
          TEST_EXIT_CODE=0
          
          # =========================================================================
          # PHASE 1: Run Pytest Governance Suite
          # =========================================================================
          echo "🧪 Running Pytest Governance Validation..."
          /usr/bin/time -v pytest tests/test_governance_validation.py -vv -s --log-cli-level=INFO 2> /tmp/pytest_mem.log || TEST_EXIT_CODE=1
          
          # =========================================================================
          # PHASE 2: Run Dynamic Pipeline Sandbox Validations
          # =========================================================================
          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "🔍 Discovering and Sandboxing Pipelines..."
            PIPELINE_FILES=$(find pipelines -maxdepth 1 -name "*.json" 2>/dev/null || true)
            
            if [ -z "$PIPELINE_FILES" ]; then
              echo "⚠️ No pipeline JSON files found in pipelines/"
            else
              for pipeline_file in $PIPELINE_FILES; do
                echo "=================================================="
                echo "🚀 Sandboxing Pipeline: $pipeline_file"
                echo "=================================================="
                
                PIPELINE_BASE=$(basename "$pipeline_file" .json)
                SANDBOX_DIR="/tmp/sandbox_$PIPELINE_BASE"
                mkdir -p "$SANDBOX_DIR"
                
                # Parse Setup Script Path
                SETUP_SCRIPT=$(jq -r '.setup_script' "$pipeline_file")
                echo "  ↳ Setup Script: $SETUP_SCRIPT"
                
                if [ "$SETUP_SCRIPT" != "null" ] && [ -n "$SETUP_SCRIPT" ]; then
                  if [ -f "$SETUP_SCRIPT" ]; then
                    echo "  ▶ Executing setup script in sandbox..."
                    cp "$SETUP_SCRIPT" "$SANDBOX_DIR/"
                    SCRIPT_NAME=$(basename "$SETUP_SCRIPT")
                    chmod +x "$SANDBOX_DIR/$SCRIPT_NAME"
                    
                    # Track resource footprint of setup execution
                    /usr/bin/time -v bash -c "cd $SANDBOX_DIR && ./$SCRIPT_NAME" 2> "/tmp/mem_sandbox_${PIPELINE_BASE}_setup.log" || {
                      echo "❌ ERROR: Setup script $SETUP_SCRIPT failed in sandbox!"
                      TEST_EXIT_CODE=1
                      break
                    }
                  else
                    echo "❌ ERROR: Setup script file $SETUP_SCRIPT specified in $pipeline_file does not exist!"
                    TEST_EXIT_CODE=1
                    break
                  fi
                fi
                
                # Parse and Process Execution Chain
                echo "  ▶ Resolving and Cloning Execution Chain..."
                CHAIN_LEN=$(jq '.execution_chain | length' "$pipeline_file")
                
                for ((i=0; i<CHAIN_LEN; i++)); do
                  REPO_URL=$(jq -r ".execution_chain[$i].repository_url" "$pipeline_file")
                  VERSION_TAG=$(jq -r ".execution_chain[$i].version_tag" "$pipeline_file")
                  REPO_NAME=$(basename "$REPO_URL" .git)
                  TARGET_PATH="$SANDBOX_DIR/modules/$REPO_NAME"
                  
                  # IDEMPOTENT CLONING LOGIC: Skip if directory exists
                  if [ -d "$TARGET_PATH" ]; then
                    echo "    - [$((i+1))/$CHAIN_LEN] Skipping $REPO_NAME; directory already exists at $TARGET_PATH."
                  else
                    echo "    - [$((i+1))/$CHAIN_LEN] Cloning $REPO_NAME ($VERSION_TAG) from $REPO_URL..."
                    
                    # Track resource footprint of git clone execution
                    /usr/bin/time -v git clone --branch "$VERSION_TAG" --depth 1 "$REPO_URL" "$TARGET_PATH" 2> "/tmp/mem_sandbox_${PIPELINE_BASE}_clone_${i}.log" || {
                      echo "❌ ERROR: Failed to clone $REPO_URL with tag $VERSION_TAG!"
                      TEST_EXIT_CODE=1
                      break 2
                    }
                  fi
                done
                
                echo "✅ Sandbox for $pipeline_file verified successfully!"
              done
            fi
          fi
          
          # Terminate background track sampler
          kill $SAMPLER_PID
          
          # =========================================================================
          # METRICS AGGREGATION
          # =========================================================================
          # Extract peak CPU load captured by sampler
          PEAK_CPU=$(sort -n /tmp/cpu_track.log | tail -n 1)
          if [ -z "$PEAK_CPU" ]; then PEAK_CPU="0.0"; fi
          
          # Read all memory profile files collectively to find the true overall peak RSS memory
          MAX_RSS_KB=$(cat /tmp/pytest_mem.log /tmp/mem_sandbox_*.log 2>/dev/null | grep "Maximum resident set size" | awk '{print $6}' | sort -n | tail -n 1)
          if [ -z "$MAX_RSS_KB" ]; then
            MAX_RSS_MB=$(free -m | awk '/Mem:/ { print $3 }')
          else
            MAX_RSS_MB=$((MAX_RSS_KB / 1024))
          fi
          TOTAL_MEM_MB=$(free -m | awk '/Mem:/ { print $2 }')
          
          # Bind metrics to environment variables
          echo "GOVERNANCE_ACTIVE_PEAK_CPU=${PEAK_CPU}%" >> $GITHUB_ENV
          echo "GOVERNANCE_ACTIVE_PEAK_MEM=${MAX_RSS_MB}/${TOTAL_MEM_MB}MB" >> $GITHUB_ENV
          
          exit $TEST_EXIT_CODE

      - name: 🏁 Validation Summary
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ Governance Check Passed: All schemas and range configs are compliant."
          else
            echo "❌ Governance Check Failed: Please review the validator output above."
            exit 1
          fi

      - name: 🔒 Version & Lock Governance Assets
        if: success()
        run: |
          # Target directories
          DIRS=("configs" "pipelines" "setup_scripts")
          
          for dir in "${DIRS[@]}"; do
            if [ -d "$dir" ]; then
              for file in "$dir"/*; do
                if [ -f "$file" ]; then
                  # Generate a hash based purely on the FILE CONTENT (7 characters)
                  CONTENT_HASH=$(git hash-object "$file" | cut -c1-7)
                  
                  # Extract extension and base name
                  ext="${file##*.}"
                  filename=$(basename "$file")
                  base="${filename%.*}"
                  
                  # Logic: If the file already contains the hash, skip renaming
                  if [[ "$base" == *"_$CONTENT_HASH" ]]; then
                    echo "✅ File $filename is already versioned correctly ($CONTENT_HASH). Skipping."
                    continue
                  fi
                  
                  # Remove any old hash suffix
                  new_base=$(echo "$base" | sed -E 's/_[a-f0-9]+$//')
                  new_filename="${new_base}_${CONTENT_HASH}.${ext}"
                  
                  echo "🔄 Renaming $filename to $new_filename"
                  git mv "$file" "$dir/$new_filename"

                  # ---------------------------------------------------------
                  # 🔍 INLINE DEEP SWEEP: Update references immediately
                  # ---------------------------------------------------------
                  
                  echo "🔎 Searching everywhere for references to '$filename' ➔ '$new_filename'"
                  
                  # Find files that contain the old filename
                  matches=$(grep -RIl "$filename" . || true)

                  if [ -n "$matches" ]; then
                    echo "📄 Found references in:"
                    echo "$matches"

                    for mfile in $matches; do
                      echo "✏️ Updating text inside: $mfile"
                      
                      # Perform the replacement using | as a delimiter
                      sed -i "s|${filename}|${new_filename}|g" "$mfile"
                      
                      # Verification Step: Did the change actually happen?
                      if grep -q "$new_filename" "$mfile"; then
                        echo "  ✅ Verification passed: $new_filename found in $mfile"
                        git add "$mfile"
                      else
                        echo "  ❌ ERROR: Replacement failed for $mfile. Trying alternative format."
                        # Fallback: sometimes paths inside JSON require escaping
                        sed -i "s|${filename//\//\\/}|${new_filename//\//\\/}|g" "$mfile"
                      fi
                    done
                  else
                    echo "ℹ️ No references found for $filename"
                  fi
                  # ---------------------------------------------------------
                fi
              done
            fi
          done
          
          # Commit the changes if there are any
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "🤖 robot: version-lock governance assets [skip ci]"
            git push origin HEAD
            echo "🚀 Version lock pushed to repository."
          else
            echo "✅ All files are already perfectly version-locked."
          fi

      - name: 🔍 Forensic Audit Production
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ All systems nominal. No anomalies detected."
            cat <<EOF > debug/forensic_audit_production.sh
          #!/bin/bash
          # Description: Automated forensic audit for ACE solver failures.
          # Status: Dormant (All systems nominal)
          exit 0
          EOF
            chmod +x debug/forensic_audit_production.sh
            echo "🧹 Diagnostic script reset to Dormant mode."
          else
            echo "⚠️ CI Failure Detected. Initiating Deep Forensic Audit..."
            echo "============================================================"
            echo "ls -R output:"
            ls -R
            echo "============================================================"
            echo "debug/forensic_audit_production.sh run results:"
            if [ -f "debug/forensic_audit_production.sh" ]; then
              bash debug/forensic_audit_production.sh
            else
              echo "❌ Critical: Diagnostic script 'debug/forensic_audit_production.sh' not found."
            fi
            echo "============================================================"
            echo "📉 RE-RUNNING FAILED TEST FOR FINAL SIGNAL"
            $TEST_COMMAND || true
            exit 1
          fi

      - name: 📊 Audit Performance Ledger & Sync
        if: always()
        run: |
          # ⚠️ WARNING: git reset/clean deletes non-tracked files. 
          # Ensure your simulation artifacts are already saved/uploaded before this step!
          git reset --hard HEAD
          git clean -ffdx
          git pull origin HEAD --rebase

          RUN_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          STATUS="${{ job.status }}"
          CURRENT_BRANCH=${GITHUB_REF##*/}
          
          # Inject true active peak metrics, using instant system calls only as an early step failure fallback
          CPU_LOAD="${GOVERNANCE_ACTIVE_PEAK_CPU:-$(top -bn1 | grep "Cpu(s)" | awk '{print $2 + $4 "%"}')}"
          MEM_USAGE="${GOVERNANCE_ACTIVE_PEAK_MEM:-$(free -m | awk '/Mem:/ { print $3 "/" $2 "MB" }')}"

          # New log entry
          # Construct the URL for the current run
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          NEW_ENTRY=$(cat <<EOF
          ### Audit: $RUN_DATE
          - **Branch:** \`$CURRENT_BRANCH\`
          - **Status:** \`$STATUS\`
          - **Run:** [Detailed Execution Logs]($RUN_URL)
          - **CPU Load:** \`$CPU_LOAD\`
          - **Memory Usage:** \`$MEM_USAGE\`
          ---
          EOF
          )

          HEADER="# 🌊 Fluid Dynamics Library for the Simulators Aggregator: Performance Audit"
          TUTORIAL="### 📚 Resources & Documentation
          - **Tutorial/Book:** ***currently in development***
          ---"

          if [ -f "README.md" ]; then
              # Extract everything after the first horizontal rule to preserve the body
              sed '1,/---/d' README.md > old_body.tmp
              echo "$HEADER" > README.md
              echo "$TUTORIAL" >> README.md
              echo "$NEW_ENTRY" >> README.md
              cat old_body.tmp >> README.md
              rm old_body.tmp
          else
              # Initialize new README
              echo "$HEADER" > README.md
              echo "$TUTORIAL" >> README.md
              echo "$NEW_ENTRY" >> README.md
          fi

          git add README.md

          if [ -n "$(git status --porcelain README.md)" ]; then
            git commit -m "🤖 robot: audit ledger update [${{ job.status }}] [skip ci]"
            TARGET_COMMIT=$(git rev-parse HEAD)

            # 1 Fetch remote notes
            git fetch origin refs/notes/commits:refs/notes/commits || true

            # 2 Add note locally
            git notes add -f -m "robot: true" "$TARGET_COMMIT"

            # 3 Push commit and notes
            git pull origin HEAD --rebase || echo "Rebase failed, pushing without rebase."
            git push origin HEAD
            git push --force origin refs/notes/commits || true
          else
            echo "No ledger changes."
          fi